{{- if and .Values.tenant.enabled .Values.tenant.minio.enabled }}
{{- $m := .Values.tenant.minio -}}
{{- $ns := .Release.Namespace -}}
{{- $kes := $m.kes | default dict -}}
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: {{ $ns }}-minio-tenant
  namespace: {{ $ns }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
spec:
  configuration:
    name: {{ $ns }}-minio-creds
  buckets:
    - name: {{ $ns }}
      objectLock: false
      region: us-east-1
  mountPath: /export
  subPath: /data
  serviceAccountName: {{ include "erpnext.serviceAccountName" . }}
  requestAutoCert: false
  prometheusOperator: false
  podManagementPolicy: Parallel
  features:
    bucketDNS: false
    enableSFTP: false
  env:
    - name: MINIO_PROMETHEUS_AUTH_TYPE
      value: public
    - name: MINIO_SERVER_URL
      value: {{ printf "https://minio-%s" (include "glerp.tenantFqdn" .) | quote }}
    - name: MINIO_BROWSER_REDIRECT_URL
      value: {{ printf "https://minio-%s" (include "glerp.tenantFqdn" .) | quote }}
  # Encryption-at-rest is provided by KES (below), which talks to Vault as a KV client over its
  # own k8s-auth JWT. MinIO does NOT talk to Vault directly anymore — the old MINIO_KMS_VAULT_*
  # env (MinIO->Vault) was the abandoned approach (handoff doc §7) and is intentionally gone.
  {{- if $kes.enabled }}
  kes:
    keyName: {{ printf "%s-minio-key" $ns | quote }}
    serviceAccountName: {{ printf "%s-minio-tenant-kes" $ns | quote }}
    image: {{ $kes.image | default "minio/kes:2025-03-12T09-35-18Z" | quote }}
    # LABEL (not annotation) is what gets KES a mesh sidecar in an UNLABELED namespace — Istio's
    # injector matches the pod label via objectSelector (handoff doc §2). Do not change to annotation.
    labels:
      sidecar.istio.io/inject: "true"
    # Exclude KES's port 7373 from Envoy inbound capture: KES serves native TLS there, so Envoy
    # must not build an HTTP inbound listener for it or every connection resets (doc §2). A
    # PERMISSIVE PeerAuthentication does NOT fix this — the exclusion is the actual fix.
    annotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "7373"
    kesSecret:
      name: kes-config-secret
  {{- end }}
  pools:
    {{- range $i := until (int ($m.pools | default 2)) }}
    - name: pool-{{ $i }}
      servers: {{ $m.servers | default 2 }}
      volumesPerServer: {{ $m.volumesPerServer | default 2 }}
      # Keep the service mesh OFF the MinIO data-plane pods (matches production; mesh is reserved
      # for sensitive traffic only). An injected Envoy captures MinIO's OUTBOUND call to KES:7373
      # and re-originates it WITHOUT MinIO's client cert, so KES (which requires mTLS client auth)
      # rejects it with "client didn't provide a certificate" — surfacing to `mc` as the generic
      # "insufficient permissions to perform KMS operation" and silently breaking encryption. The
      # KES pod itself stays meshed (see .spec.kes.labels above) so its Vault hop is protected;
      # only the high-throughput S3 data path is kept out of the mesh (no Envoy latency/overhead).
      labels:
        sidecar.istio.io/inject: "false"
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: {{ $m.storageClass | default "directpv-min-io" }}
          resources:
            requests:
              storage: {{ $m.volumeSize | default "3Gi" }}
      securityContext:
        fsGroup: 1000
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
    {{- end }}
{{- end }}
