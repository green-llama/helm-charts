{{- if and .Values.tenant.enabled .Values.tenant.minio.enabled (.Values.tenant.minio.kes | default dict).enabled }}
{{- $ns := .Release.Namespace -}}
# RBAC for the KES-activate hook (job-minio-kes-activate.yaml). Scoped to exactly what the hook
# needs: read the Operator-generated MinIO client-cert secret + the minio creds, patch the
# kes-config-secret with the resolved identity, and bounce the KES pods so it reloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-minio-kes-activate" $ns }}
  namespace: {{ $ns }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # get/list to find the cert + creds secrets; patch to write the resolved identity into
    # kes-config-secret. (Namespaced — cannot touch secrets in other namespaces.)
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    # list KES pods and delete them to force a reload after the config changes.
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-minio-kes-activate" $ns }}
  namespace: {{ $ns }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-minio-tenant-kes" $ns }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-minio-kes-activate" $ns }}
{{- end }}
