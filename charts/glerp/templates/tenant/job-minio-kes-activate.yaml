{{- if and .Values.tenant.enabled .Values.tenant.minio.enabled (.Values.tenant.minio.kes | default dict).enabled }}
{{- $ns := .Release.Namespace -}}
{{- $m := .Values.tenant.minio -}}
{{- $kes := $m.kes | default dict -}}
# Post-install/upgrade hook: turns "Tenant created" into "encryption actually working", no manual
# steps. SINGLE main container (glerp image: python3/openssl/curl) that also gets the static `mc`
# binary copied in by an initContainer from minio/mc — so ONE process can do everything AND bounce
# KES between attempts:
#   1. resolve the MinIO client-cert identity (sha256 of <ns>-minio-tenant-client-tls/public.crt)
#      and patch kes-config-secret's policy.minio.identities via the K8s API.
#   2. RETRY LOOP: bounce the KES pods (K8s API) so KES re-initializes its Vault keystore, wait
#      for them Ready, then run a REAL KMS op (`mc admin kms key create` + `mc encrypt set`). If
#      the op fails (fresh-install KES cold-start caches a broken keystore / stale Vault token,
#      surfacing as "insufficient permissions"), loop: bounce KES again and retry. This is the
#      reliable fix — KES gets re-bounced IN the loop until a real KMS operation succeeds, rather
#      than relying on Job-level restarts.
# Backfill of pre-existing plaintext objects is documented + scheduled separately (TENANT.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-minio-kes-activate" $ns }}
  namespace: {{ $ns }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $kes.activateBackoffLimit | default 6 }}
  {{- with .Values.jobs.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "erpnext.labels" . | nindent 8 }}
    spec:
      # Runs as the KES SA; RBAC (minio-kes-rbac.yaml) grants exactly get/list/patch secrets +
      # get/list/delete pods, in THIS namespace only.
      serviceAccountName: {{ printf "%s-minio-tenant-kes" $ns }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: mcbin
          emptyDir: {}
      initContainers:
        # Copy the STATIC `mc` binary out of minio/mc into a shared volume so the main container
        # (glerp image — which has python3/openssl/curl but not mc) can run KMS operations.
        - name: fetch-mc
          image: {{ $kes.activateImage | default "minio/mc:RELEASE.2025-03-12T17-29-24Z" | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["cp /usr/bin/mc /mcbin/mc && chmod 0755 /mcbin/mc && echo 'mc copied'"]
          volumeMounts:
            - name: mcbin
              mountPath: /mcbin
      containers:
        - name: activate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-c"]
          volumeMounts:
            - name: mcbin
              mountPath: /mcbin
          env:
            - name: NS
              value: {{ $ns | quote }}
            - name: TENANT
              value: {{ printf "%s-minio-tenant" $ns | quote }}
            - name: KEY_NAME
              value: {{ printf "%s-minio-key" $ns | quote }}
            - name: BUCKET
              value: {{ $ns | quote }}
            - name: MINIO_ENDPOINT
              value: {{ printf "http://minio.%s.svc.cluster.local:80" $ns | quote }}
            # The MinIO client cert MinIO presents to KES. The Operator generates this as an Opaque
            # secret "<tenant>-client-tls" with the cert under key "public.crt". Overridable.
            - name: CLIENT_CERT_SECRET
              value: {{ $kes.clientCertSecret | default (printf "%s-minio-tenant-client-tls" $ns) | quote }}
            - name: CLIENT_CERT_KEY
              value: {{ $kes.clientCertKey | default "public.crt" | quote }}
            - name: MC
              value: "/mcbin/mc"
            - name: MC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio-creds" $ns | quote }}
                  key: accesskey
            - name: MC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio-creds" $ns | quote }}
                  key: secretkey
          args:
            - |
              import base64, hashlib, json, os, re, ssl, subprocess, sys, time, urllib.request, urllib.error

              NS=os.environ["NS"]; TENANT=os.environ["TENANT"]
              KEY_NAME=os.environ["KEY_NAME"]; BUCKET=os.environ["BUCKET"]
              ENDPOINT=os.environ["MINIO_ENDPOINT"]
              CERT_SECRET=os.environ["CLIENT_CERT_SECRET"]; CERT_KEY=os.environ["CLIENT_CERT_KEY"]
              MC=os.environ["MC"]; AK=os.environ["MC_ACCESS_KEY"]; SK=os.environ["MC_SECRET_KEY"]
              API="https://kubernetes.default.svc"
              tok=open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              ctx=ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def api(path, method="GET", body=None):
                  data=json.dumps(body).encode() if body is not None else None
                  ct="application/strategic-merge-patch+json" if method=="PATCH" else "application/json"
                  req=urllib.request.Request(API+path, data=data, method=method,
                      headers={"Authorization": f"Bearer {tok}", "Content-Type": ct})
                  with urllib.request.urlopen(req, context=ctx) as r:
                      b=r.read(); return json.loads(b) if b else {}

              def get_secret(name):
                  try: return api(f"/api/v1/namespaces/{NS}/secrets/{name}")
                  except urllib.error.HTTPError as e:
                      if e.code==404: return None
                      raise

              def kes_pod_names():
                  pods=api(f"/api/v1/namespaces/{NS}/pods?labelSelector=v1.min.io/tenant={TENANT}").get("items", [])
                  return [p["metadata"]["name"] for p in pods if "kes" in p["metadata"]["name"]]

              def bounce_kes():
                  for n in kes_pod_names():
                      try: api(f"/api/v1/namespaces/{NS}/pods/{n}", "DELETE"); print(f"  bounced KES pod {n}")
                      except urllib.error.HTTPError as e:
                          if e.code!=404: raise

              def wait_kes_ready(timeout=180):
                  for _ in range(timeout//5):
                      time.sleep(5)
                      pods=api(f"/api/v1/namespaces/{NS}/pods?labelSelector=v1.min.io/tenant={TENANT}").get("items", [])
                      kes=[p for p in pods if "kes" in p["metadata"]["name"]]
                      ready=[p for p in kes if p.get("status",{}).get("phase")=="Running"
                             and all(c.get("ready") for c in p.get("status",{}).get("containerStatuses",[]))]
                      if kes and len(ready)==len(kes):
                          print(f"  {len(ready)}/{len(kes)} KES pods Ready."); return True
                  print("  KES pods not Ready in time (continuing)." ); return False

              def mc(*a, check=False):
                  return subprocess.run([MC, *a], capture_output=True, text=True, check=check)

              # ---- 1. Resolve the MinIO client-cert identity and patch kes-config-secret ----
              KEY_CANDIDATES=[CERT_KEY]+[k for k in ("public.crt","tls.crt") if k!=CERT_KEY]
              sec=crt_b64=None
              for _ in range(60):
                  sec=get_secret(CERT_SECRET)
                  if sec:
                      d=sec.get("data") or {}
                      crt_b64=next((d[k] for k in KEY_CANDIDATES if d.get(k)), None)
                      if crt_b64: break
                  print(f"waiting for client-cert secret {CERT_SECRET}..."); time.sleep(5)
              else:
                  print(f"client-cert secret {CERT_SECRET} not found in time", file=sys.stderr); sys.exit(1)
              crt=base64.b64decode(crt_b64)
              der=subprocess.run(["openssl","x509","-pubkey","-noout"], input=crt, capture_output=True, check=True).stdout
              der=subprocess.run(["openssl","pkey","-pubin","-outform","DER"], input=der, capture_output=True, check=True).stdout
              identity=hashlib.sha256(der).hexdigest()
              print(f"identity: {identity}")
              kc=api(f"/api/v1/namespaces/{NS}/secrets/kes-config-secret")
              cfg=base64.b64decode(kc["data"]["server-config.yaml"]).decode()
              if f'"{identity}"' in cfg:
                  print("identity already current — no config patch needed.")
              else:
                  new=re.sub(r'- "(?:_pending_|[0-9a-f]{64})"', f'- "{identity}"', cfg)
                  api(f"/api/v1/namespaces/{NS}/secrets/kes-config-secret", "PATCH",
                      {"data": {"server-config.yaml": base64.b64encode(new.encode()).decode()}})
                  print("patched kes-config-secret with the resolved identity.")

              # ---- 2. Configure mc + wait for the S3 API ----
              mc("alias","set","t",ENDPOINT,AK,SK)
              for _ in range(60):
                  if mc("ready","t").returncode==0 or mc("ls","t").returncode==0: break
                  print("waiting for MinIO S3 API..."); time.sleep(5)

              # ---- 3. Retry loop: try a real KMS op; bounce KES only when needed, until it works ----
              # CONFIRMED root cause of fresh-install "insufficient permissions": KES is pod-Ready
              # but its Vault KEYSTORE SESSION isn't usable yet (cold-start). A KES restart AFTER the
              # cluster/Vault settles fixes it. But bouncing KES on EVERY cycle just resets its
              # settle clock, so instead: try the op first; only bounce when it's been failing, and
              # give a generous settle after each bounce. Gate on a real KMS op (`mc encrypt set` ==
              # KES key/generate; nonzero on failure), never on parsed text.
              #   MAX_CYCLES default 20 and BOUNCE_EVERY 3 => up to ~20*settle of runtime, bouncing
              #   ~every 3rd failing cycle — tolerates a slow-settling fresh cluster (the failure
              #   mode this session, where 8 cycles gave up before Vault settled). All tunable via env.
              MAX=int(os.environ.get("MAX_CYCLES","20"))
              SETTLE=int(os.environ.get("SETTLE_SECONDS","15"))     # wait after Ready before a KMS op
              BOUNCE_EVERY=int(os.environ.get("BOUNCE_EVERY","3"))  # bounce KES once per N failing cycles
              ok=False; fails=0
              for c in range(1, MAX+1):
                  # On the first cycle, and once per BOUNCE_EVERY failures thereafter, bounce KES so it
                  # re-auths to Vault; otherwise just wait and retry (let the existing session settle).
                  if c==1 or (fails and fails % BOUNCE_EVERY == 0):
                      print(f"=== cycle {c}/{MAX}: bouncing KES so it re-auths to Vault ===")
                      bounce_kes(); wait_kes_ready()
                  else:
                      print(f"=== cycle {c}/{MAX}: retrying KMS op (letting KES's Vault session settle) ===")
                  time.sleep(SETTLE)
                  mc("admin","kms","key","create","t",KEY_NAME)   # idempotent; ignore result
                  r=mc("encrypt","set","sse-kms",KEY_NAME,f"t/{BUCKET}")
                  if r.returncode==0:
                      ok=True; print("SSE-KMS enabled — real KMS op succeeded."); break
                  fails+=1
                  print(f"  KMS op still failing (fail {fails}): {(r.stderr or r.stdout).strip()[:200]}")
              if not ok:
                  print("KMS activation did not succeed after all cycles.", file=sys.stderr); sys.exit(1)
              print(mc("encrypt","info",f"t/{BUCKET}").stdout)
              print(mc("admin","kms","key","status","t",KEY_NAME).stdout)
              print(f"Done: bucket '{BUCKET}' encrypts new writes with SSE-KMS key '{KEY_NAME}'.")
{{- end }}
