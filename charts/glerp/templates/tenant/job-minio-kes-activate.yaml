{{- if and .Values.tenant.enabled .Values.tenant.minio.enabled (.Values.tenant.minio.kes | default dict).enabled }}
{{- $ns := .Release.Namespace -}}
{{- $m := .Values.tenant.minio -}}
{{- $kes := $m.kes | default dict -}}
# Post-install/upgrade hook: turns "Tenant created" into "encryption actually working", no manual
# steps. SINGLE main container (glerp image: python3/openssl/curl) that also gets the static `mc`
# binary copied in by an initContainer from minio/mc — so ONE process can do everything AND bounce
# KES between attempts:
#   1. resolve the MinIO client-cert identity (sha256 of <ns>-minio-tenant-client-tls/public.crt)
#      and patch kes-config-secret's policy.minio.identities via the K8s API.
#   2. RETRY LOOP: bounce the KES pods (K8s API) so KES re-initializes its Vault keystore, wait
#      for them Ready, then run a REAL KMS op (`mc admin kms key create` + `mc encrypt set`). If
#      the op fails (fresh-install KES cold-start caches a broken keystore / stale Vault token,
#      surfacing as "insufficient permissions"), loop: bounce KES again and retry. This is the
#      reliable fix — KES gets re-bounced IN the loop until a real KMS operation succeeds, rather
#      than relying on Job-level restarts.
# Backfill of pre-existing plaintext objects is documented + scheduled separately (TENANT.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-minio-kes-activate" $ns }}
  namespace: {{ $ns }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $kes.activateBackoffLimit | default 6 }}
  {{- with .Values.jobs.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "erpnext.labels" . | nindent 8 }}
    spec:
      # Runs as the KES SA; RBAC (minio-kes-rbac.yaml) grants exactly get/list/patch secrets +
      # get/list/delete pods, in THIS namespace only.
      serviceAccountName: {{ printf "%s-minio-tenant-kes" $ns }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: mcbin
          emptyDir: {}
      initContainers:
        # Copy the STATIC `mc` binary out of minio/mc into a shared volume so the main container
        # (glerp image — which has python3/openssl/curl but not mc) can run KMS operations.
        - name: fetch-mc
          image: {{ $kes.activateImage | default "minio/mc:RELEASE.2025-03-12T17-29-24Z" | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["cp /usr/bin/mc /mcbin/mc && chmod 0755 /mcbin/mc && echo 'mc copied'"]
          volumeMounts:
            - name: mcbin
              mountPath: /mcbin
      containers:
        - name: activate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-u", "-c"]   # -u = unbuffered stdout so `kubectl logs` shows live progress
          volumeMounts:
            - name: mcbin
              mountPath: /mcbin
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NS
              value: {{ $ns | quote }}
            - name: TENANT
              value: {{ printf "%s-minio-tenant" $ns | quote }}
            - name: KEY_NAME
              value: {{ printf "%s-minio-key" $ns | quote }}
            - name: BUCKET
              value: {{ $ns | quote }}
            - name: MINIO_ENDPOINT
              value: {{ printf "http://minio.%s.svc.cluster.local:80" $ns | quote }}
            # The MinIO client cert MinIO presents to KES. The Operator generates this as an Opaque
            # secret "<tenant>-client-tls" with the cert under key "public.crt". Overridable.
            - name: CLIENT_CERT_SECRET
              value: {{ $kes.clientCertSecret | default (printf "%s-minio-tenant-client-tls" $ns) | quote }}
            - name: CLIENT_CERT_KEY
              value: {{ $kes.clientCertKey | default "public.crt" | quote }}
            - name: MC
              value: "/mcbin/mc"
            - name: MC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio-creds" $ns | quote }}
                  key: accesskey
            - name: MC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio-creds" $ns | quote }}
                  key: secretkey
          args:
            - |
              import base64, hashlib, json, os, re, ssl, subprocess, sys, time, urllib.request, urllib.error

              NS=os.environ["NS"]; TENANT=os.environ["TENANT"]
              KEY_NAME=os.environ["KEY_NAME"]; BUCKET=os.environ["BUCKET"]
              ENDPOINT=os.environ["MINIO_ENDPOINT"]
              CERT_SECRET=os.environ["CLIENT_CERT_SECRET"]; CERT_KEY=os.environ["CLIENT_CERT_KEY"]
              MC=os.environ["MC"]; AK=os.environ["MC_ACCESS_KEY"]; SK=os.environ["MC_SECRET_KEY"]
              API="https://kubernetes.default.svc"
              tok=open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              ctx=ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def api(path, method="GET", body=None):
                  data=json.dumps(body).encode() if body is not None else None
                  ct="application/strategic-merge-patch+json" if method=="PATCH" else "application/json"
                  req=urllib.request.Request(API+path, data=data, method=method,
                      headers={"Authorization": f"Bearer {tok}", "Content-Type": ct})
                  with urllib.request.urlopen(req, context=ctx) as r:
                      b=r.read(); return json.loads(b) if b else {}

              def get_secret(name):
                  try: return api(f"/api/v1/namespaces/{NS}/secrets/{name}")
                  except urllib.error.HTTPError as e:
                      if e.code==404: return None
                      raise

              def tenant_pods(kind):
                  # The MinIO Operator labels the two pod kinds DIFFERENTLY:
                  #   KES pods:  v1.min.io/kes=<tenant>-kes        (NOT v1.min.io/tenant)
                  #   pool pods: v1.min.io/tenant=<tenant>
                  # Selecting the wrong label returns [] and any wait on it times out.
                  sel = f"v1.min.io/kes={TENANT}-kes" if kind=="kes" else f"v1.min.io/tenant={TENANT}"
                  return api(f"/api/v1/namespaces/{NS}/pods?labelSelector={sel}").get("items", [])

              def pods_ready(kind):
                  ps=tenant_pods(kind)
                  ready=[p for p in ps if p.get("status",{}).get("phase")=="Running"
                         and all(c.get("ready") for c in p.get("status",{}).get("containerStatuses",[]))]
                  return ps, ready

              def wait_ready(kind, timeout=300):
                  # Wait until ALL pods of this kind are Running+Ready. Returns True on success.
                  for _ in range(timeout//5):
                      ps, ready = pods_ready(kind)
                      if ps and len(ready)==len(ps):
                          print(f"  {len(ready)}/{len(ps)} {kind} pods Ready."); return True
                      time.sleep(5)
                  print(f"  {kind} pods not all Ready within {timeout}s (continuing)."); return False

              def pods_stable(kind, quiet=45):
                  # True only if every pod of this kind is Ready AND its container(s) started at least
                  # `quiet` seconds ago with no restart in that window — i.e. it's past its crash-loop.
                  import datetime
                  now=datetime.datetime.now(datetime.timezone.utc)
                  ps, ready = pods_ready(kind)
                  if not ps or len(ready)!=len(ps): return False
                  for p in ps:
                      for cs in p.get("status",{}).get("containerStatuses",[]):
                          st=(cs.get("state") or {}).get("running") or {}
                          started=st.get("startedAt")
                          if not started: return False
                          age=(now-datetime.datetime.fromisoformat(started.replace("Z","+00:00"))).total_seconds()
                          if age < quiet: return False
                  return True

              def bounce_kes_rolling():
                  # Restart KES ONE replica at a time, waiting for each to come back Ready before the
                  # next — so the KES Service never loses all endpoints (avoids the "no such host" /
                  # connection-refused gap that a simultaneous both-replica delete caused).
                  names=[p["metadata"]["name"] for p in tenant_pods("kes")]
                  for n in names:
                      try:
                          api(f"/api/v1/namespaces/{NS}/pods/{n}", "DELETE"); print(f"  bounced KES pod {n}; waiting for it to return Ready...")
                      except urllib.error.HTTPError as e:
                          if e.code!=404: raise
                      # wait for that pod to be gone-and-recreated Ready before touching the next one
                      time.sleep(5); wait_ready("kes")

              def mc(*a, check=False):
                  return subprocess.run([MC, *a], capture_output=True, text=True, check=check)

              # ---- 1. Resolve the MinIO client-cert identity and patch kes-config-secret ----
              KEY_CANDIDATES=[CERT_KEY]+[k for k in ("public.crt","tls.crt") if k!=CERT_KEY]
              sec=crt_b64=None
              for _ in range(60):
                  sec=get_secret(CERT_SECRET)
                  if sec:
                      d=sec.get("data") or {}
                      crt_b64=next((d[k] for k in KEY_CANDIDATES if d.get(k)), None)
                      if crt_b64: break
                  print(f"waiting for client-cert secret {CERT_SECRET}..."); time.sleep(5)
              else:
                  print(f"client-cert secret {CERT_SECRET} not found in time", file=sys.stderr); sys.exit(1)
              crt=base64.b64decode(crt_b64)
              der=subprocess.run(["openssl","x509","-pubkey","-noout"], input=crt, capture_output=True, check=True).stdout
              der=subprocess.run(["openssl","pkey","-pubin","-outform","DER"], input=der, capture_output=True, check=True).stdout
              identity=hashlib.sha256(der).hexdigest()
              print(f"identity: {identity}")
              kc=api(f"/api/v1/namespaces/{NS}/secrets/kes-config-secret")
              cfg=base64.b64decode(kc["data"]["server-config.yaml"]).decode()
              if f'"{identity}"' in cfg:
                  print("identity already current — no config patch needed.")
              else:
                  new=re.sub(r'- "(?:_pending_|[0-9a-f]{64})"', f'- "{identity}"', cfg)
                  api(f"/api/v1/namespaces/{NS}/secrets/kes-config-secret", "PATCH",
                      {"data": {"server-config.yaml": base64.b64encode(new.encode()).decode()}})
                  print("patched kes-config-secret with the resolved identity.")

              # ---- 2. Configure mc + wait for the S3 API ----
              mc("alias","set","t",ENDPOINT,AK,SK)
              for _ in range(60):
                  if mc("ready","t").returncode==0 or mc("ls","t").returncode==0: break
                  print("waiting for MinIO S3 API..."); time.sleep(5)

              # ---- 3. DELAYED ONE-SHOT activation ----
              # Root cause of the fresh-install "insufficient permissions": KES is pod-Ready before its
              # Vault keystore SESSION is usable (cold-start), AND MinIO itself crash-loops while its
              # KMS init fails. A tight retry loop that bounces KES repeatedly fought this (it reset
              # KES's settle clock and, bouncing both replicas at once, opened a "no such host" gap).
              # The manual fix only ever worked because by then the cluster had SETTLED. So: WAIT for
              # the tenant to actually settle, do ONE rolling KES bounce (to force a clean Vault
              # re-auth once Vault is reachable), then do ONE clean activation. No thrash loop.
              SETTLE=int(os.environ.get("SETTLE_SECONDS","20"))      # pause after things look stable
              STABLE_QUIET=int(os.environ.get("STABLE_QUIET","45"))  # a pod must be crash-loop-free this long
              SETTLE_TIMEOUT=int(os.environ.get("SETTLE_TIMEOUT","600"))

              # 3a. Wait for KES + MinIO pods to be Ready AND stable (past their fresh-install crash-loop).
              print("waiting for KES + MinIO pods to be Ready...")
              wait_ready("kes"); wait_ready("pool")
              print(f"waiting for pods to be STABLE (no restart for {STABLE_QUIET}s) before activating...")
              deadline=time.time()+SETTLE_TIMEOUT
              while time.time()<deadline:
                  if pods_stable("kes") and pods_stable("pool"):
                      print("  KES + MinIO are stable."); break
                  time.sleep(10)
              else:
                  print("  pods did not reach the stable window in time — proceeding anyway.")

              # 3b. ONE rolling KES bounce so KES re-auths to Vault now that the cluster is settled
              # (this is the step the manual fix performed). Rolling = one replica at a time, no gap.
              print("performing one rolling KES bounce for a fresh Vault session...")
              bounce_kes_rolling()
              wait_ready("pool")           # MinIO may re-init its KMS client after KES returns
              time.sleep(SETTLE)

              # 3c. Clean activation: create the KMS key, enable bucket SSE-KMS. Both ops are
              # IDEMPOTENT (create = "already exists", encrypt set = re-applies the same config), so
              # this retries PATIENTLY — it isn't a bounce loop, it's just waiting out transient
              # storage states. Notably, right after startup MinIO can report a "minimum free drive
              # threshold" (tiny drives) which surfaces from `mc encrypt set` as the MISLEADING error
              # "SetEncryption is not supported for filesystem" even though the backend is Erasure;
              # it clears on its own once the drives settle, so we keep retrying rather than fail.
              ACT_ATTEMPTS=int(os.environ.get("ACTIVATE_ATTEMPTS","12"))
              ok=False
              for attempt in range(1, ACT_ATTEMPTS+1):
                  mc("admin","kms","key","create","t",KEY_NAME)   # idempotent; ignore result
                  r=mc("encrypt","set","sse-kms",KEY_NAME,f"t/{BUCKET}")
                  if r.returncode==0:
                      ok=True; print(f"SSE-KMS enabled on attempt {attempt}."); break
                  msg=(r.stderr or r.stdout).strip()[:200]
                  hint=""
                  if "filesystem" in msg or "minimum free drive" in msg:
                      hint=" (transient: MinIO drives still settling / minimum-free-drive threshold — will retry)"
                  print(f"  attempt {attempt}/{ACT_ATTEMPTS} not ready yet: {msg}{hint}")
                  time.sleep(SETTLE)
              if not ok:
                  print("KMS activation did not succeed after all attempts.", file=sys.stderr); sys.exit(1)
              print(mc("encrypt","info",f"t/{BUCKET}").stdout)
              print(mc("admin","kms","key","status","t",KEY_NAME).stdout)
              print(f"Done: bucket '{BUCKET}' encrypts new writes with SSE-KMS key '{KEY_NAME}'.")
{{- end }}
