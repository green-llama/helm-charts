{{- if and .Values.tenant.enabled .Values.tenant.minio.enabled (.Values.tenant.minio.kes | default dict).enabled }}
{{- $ns := .Release.Namespace -}}
{{- $m := .Values.tenant.minio -}}
{{- $kes := $m.kes | default dict -}}
# Post-install/upgrade hook: turns "Tenant created" into "encryption actually working", with no
# manual step (handoff doc §3 + §6). Two ordered steps:
#   initContainer "patch-identity" (glerp image — has python3/openssl/curl):
#     waits for the Operator-generated MinIO client-cert secret, computes
#     sha256(client cert public key), and patches kes-config-secret's policy.minio.identities
#     via the Kubernetes API — bouncing KES ONLY when the value changed (idempotent; upgrades are
#     no-ops when the cert is unchanged; also self-heals on cert rotation).
#   container "encrypt-bucket" (minio/mc):
#     waits for the S3 API, then `mc encrypt set sse-kms` on the chart's bucket so NEW writes
#     encrypt. Backfill of pre-existing plaintext objects is documented + scheduled separately.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-minio-kes-activate" $ns }}
  namespace: {{ $ns }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $kes.activateBackoffLimit | default 10 }}
  {{- with .Values.jobs.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "erpnext.labels" . | nindent 8 }}
    spec:
      # Runs as the KES SA; RBAC (minio-kes-rbac.yaml) grants exactly get/list/patch secrets +
      # get/list/delete pods, in THIS namespace only.
      serviceAccountName: {{ printf "%s-minio-tenant-kes" $ns }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: patch-identity
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-c"]
          env:
            - name: NS
              value: {{ $ns | quote }}
            - name: TENANT
              value: {{ printf "%s-minio-tenant" $ns | quote }}
            # The MinIO client cert MinIO presents to KES. The Operator generates this as an
            # Opaque secret "<tenant>-client-tls" with the cert under key "public.crt" (verified
            # against the running MinIO pod's mounted /tmp/certs/client.crt). Overridable in case a
            # future Operator version changes the name/key.
            - name: CLIENT_CERT_SECRET
              value: {{ $kes.clientCertSecret | default (printf "%s-minio-tenant-client-tls" $ns) | quote }}
            - name: CLIENT_CERT_KEY
              value: {{ $kes.clientCertKey | default "public.crt" | quote }}
          args:
            - |
              import base64, hashlib, json, os, ssl, subprocess, sys, time, urllib.request, urllib.error

              NS = os.environ["NS"]; TENANT = os.environ["TENANT"]
              CERT_SECRET = os.environ["CLIENT_CERT_SECRET"]
              CERT_KEY = os.environ["CLIENT_CERT_KEY"]
              API = "https://kubernetes.default.svc"
              tok = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def api(path, method="GET", body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  ct = "application/strategic-merge-patch+json" if method == "PATCH" else "application/json"
                  req = urllib.request.Request(API + path, data=data, method=method,
                      headers={"Authorization": f"Bearer {tok}", "Content-Type": ct})
                  with urllib.request.urlopen(req, context=ctx) as r:
                      b = r.read(); return json.loads(b) if b else {}

              def get_secret(name):
                  try:
                      return api(f"/api/v1/namespaces/{NS}/secrets/{name}")
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      raise

              # Try CERT_KEY first, then fall back across Operator versions (public.crt current).
              KEY_CANDIDATES = [CERT_KEY] + [k for k in ("public.crt", "tls.crt") if k != CERT_KEY]

              # 1. Wait for the Operator to publish the client-cert secret (deterministic name).
              sec = crt_b64 = None
              for _ in range(60):
                  sec = get_secret(CERT_SECRET)
                  if sec:
                      data = sec.get("data") or {}
                      crt_b64 = next((data[k] for k in KEY_CANDIDATES if data.get(k)), None)
                      if crt_b64:
                          break
                  print(f"waiting for client-cert secret {CERT_SECRET}..."); time.sleep(5)
              else:
                  print(f"client-cert secret {CERT_SECRET} (key {CERT_KEY}) not found in time",
                        file=sys.stderr); sys.exit(1)
              print(f"using client-cert secret: {CERT_SECRET}")
              crt = base64.b64decode(crt_b64)

              # 2. identity = sha256 of the cert's DER-encoded PUBLIC KEY (hex, lowercase).
              der = subprocess.run(["openssl", "x509", "-pubkey", "-noout"], input=crt,
                                   capture_output=True, check=True).stdout
              der = subprocess.run(["openssl", "pkey", "-pubin", "-outform", "DER"], input=der,
                                   capture_output=True, check=True).stdout
              identity = hashlib.sha256(der).hexdigest()
              print(f"identity: {identity}")

              # 3. Patch kes-config-secret if the identity changed.
              kc = api(f"/api/v1/namespaces/{NS}/secrets/kes-config-secret")
              cfg = base64.b64decode(kc["data"]["server-config.yaml"]).decode()
              import re
              if f'"{identity}"' in cfg:
                  print("identity already current — no config patch needed.")
              else:
                  new = re.sub(r'- "(?:_pending_|[0-9a-f]{64})"', f'- "{identity}"', cfg)
                  api(f"/api/v1/namespaces/{NS}/secrets/kes-config-secret", "PATCH",
                      {"data": {"server-config.yaml": base64.b64encode(new.encode()).decode()}})
                  print("patched kes-config-secret with the resolved identity.")

              # 4. ALWAYS bounce the KES pods, then wait for them Ready. This is deliberately
              # unconditional: even when the identity was already correct, KES may be running on a
              # STALE Vault token cached before its k8s-auth path was ready (fresh installs race
              # cold) — that surfaces later as "insufficient permissions to perform KMS operation".
              # A restart forces KES to re-authenticate to Vault. Idempotent + cheap; and if the
              # encrypt-bucket step still fails, the Job's backoffLimit re-runs this whole init,
              # bouncing KES again — so the flow self-heals the token race without manual steps.
              pods = api(f"/api/v1/namespaces/{NS}/pods?labelSelector=v1.min.io/tenant={TENANT}").get("items", [])
              kes_pods = [p["metadata"]["name"] for p in pods if "kes" in p["metadata"]["name"]]
              for n in kes_pods:
                  api(f"/api/v1/namespaces/{NS}/pods/{n}", "DELETE"); print(f"  deleted KES pod {n}")

              # Wait for KES pods to be Ready again so the encrypt container doesn't race DNS/startup.
              print("waiting for KES pods to become Ready...")
              for _ in range(60):
                  time.sleep(5)
                  pods = api(f"/api/v1/namespaces/{NS}/pods?labelSelector=v1.min.io/tenant={TENANT}").get("items", [])
                  kes = [p for p in pods if "kes" in p["metadata"]["name"]]
                  ready = [p for p in kes
                           if p.get("status", {}).get("phase") == "Running"
                           and all(c.get("ready") for c in p.get("status", {}).get("containerStatuses", []))]
                  if kes and len(ready) == len(kes):
                      print(f"  {len(ready)}/{len(kes)} KES pods Ready."); break
              else:
                  print("KES pods did not become Ready in time (continuing; encrypt step will retry).")
      containers:
        - name: encrypt-bucket
          image: {{ $kes.activateImage | default "minio/mc:RELEASE.2025-03-12T17-29-24Z" | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          env:
            - name: KEY_NAME
              value: {{ printf "%s-minio-key" $ns | quote }}
            - name: BUCKET
              value: {{ $ns | quote }}
            - name: MINIO_ENDPOINT
              value: {{ printf "http://minio.%s.svc.cluster.local:80" $ns | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio-creds" $ns | quote }}
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio-creds" $ns | quote }}
                  key: secretkey
          args:
            - |
              set -eu
              i=0
              until mc alias set t "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -gt 60 ] && { echo "MinIO S3 API not reachable"; exit 1; }
                echo "waiting for MinIO S3 API..."; sleep 5
              done
              # Wait for MinIO->KES to be reachable, then ensure the KMS root key EXISTS AND WORKS.
              # `mc encrypt set` does NOT create the key, so we create it. This must be robust in
              # the minio/mc image, which is MINIMAL: only sh + mc (NO grep/sed/awk). So we do NOT
              # parse error text — we test the key's health with `mc admin kms key status <key>`,
              # which is the source of truth: if it reports the key is usable, we're done, whether
              # this run created it or it already existed (idempotent, no string matching).
              i=0
              until mc admin kms key status t >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -gt 60 ] && { echo "KES/KMS not reachable via MinIO"; exit 1; }
                echo "waiting for MinIO->KES KMS to be reachable..."; sleep 5
              done
              # Try to create the key (harmless if it already exists), then verify by STATUS —
              # ignoring the create's exit code entirely (an "already exists" error is success here).
              ok=0
              i=0
              while [ "$i" -le 12 ]; do
                mc admin kms key create t "$KEY_NAME" >/dev/null 2>&1 || true
                if mc admin kms key status t "$KEY_NAME" >/dev/null 2>&1; then ok=1; break; fi
                i=$((i+1)); echo "key '$KEY_NAME' not usable yet; retrying..."; sleep 5
              done
              [ "$ok" = "1" ] || { echo "KMS key '$KEY_NAME' is not usable after retries"; mc admin kms key status t "$KEY_NAME" || true; exit 1; }
              echo "KMS key '$KEY_NAME' is present and usable."
              mc admin kms key status t "$KEY_NAME"
              mc encrypt set sse-kms "$KEY_NAME" "t/$BUCKET"
              mc encrypt info "t/$BUCKET" || true
              echo "SSE-KMS enabled on bucket '$BUCKET' with key '$KEY_NAME' — new writes are encrypted."
{{- end }}
