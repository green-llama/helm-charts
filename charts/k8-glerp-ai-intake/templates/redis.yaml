{{- if .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intake-redis-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: intake-redis
    app.kubernetes.io/part-of: glerp-ai-intake
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.redis.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: intake-redis
    app.kubernetes.io/part-of: glerp-ai-intake
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intake-redis
  template:
    metadata:
      labels:
        app: intake-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: intake-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: intake-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: intake-redis
    app.kubernetes.io/part-of: glerp-ai-intake
spec:
  selector:
    app: intake-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
{{- end }}
