{{- if .Values.eso.enabled }}
{{- $ns := .Release.Namespace -}}
{{- $mount := .Values.eso.vaultMountPath -}}
# ── intake-secrets (JWT_SECRET_KEY from Vault) ────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intake-secrets-es
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: glerp-ai-intake
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: intake-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        JWT_SECRET_KEY: "{{ printf `{{ .jwt_secret_key }}` }}"
  data:
    - secretKey: jwt_secret_key
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/intake-secrets
        property: jwt-secret-key
---
# ── ghcr-cred (GHCR image pull secret from Vault) ────────────────────────────
# Reads from the same shared Vault path the glerp chart uses — one canonical
# copy in Vault, each namespace gets its own ExternalSecret-managed K8s Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-cred
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: glerp-ai-intake
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: ghcr-cred
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ printf `{{ .config }}` }}"
  data:
    - secretKey: config
      remoteRef:
        key: {{ .Values.eso.ghcrVaultKey }}
        property: config
{{- end }}
