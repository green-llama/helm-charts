{{- if .Values.eso.enabled }}
{{- $ns := .Release.Namespace }}
# Pre-install/pre-upgrade hook: waits for ESO to sync both ExternalSecrets before
# Helm proceeds to create the Deployments. Without this, pods are scheduled before
# ghcr-cred exists and hit ImagePullBackOff on fresh installs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intake-eso-wait
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intake-eso-wait
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intake-eso-wait
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intake-eso-wait
subjects:
  - kind: ServiceAccount
    name: intake-eso-wait
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: intake-eso-wait
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      serviceAccountName: intake-eso-wait
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for ESO to sync intake-secrets and ghcr-cred..."
              until kubectl get secret intake-secrets -n {{ $ns }} >/dev/null 2>&1; do
                echo "  intake-secrets not ready yet, waiting 5s..."
                sleep 5
              done
              echo "  intake-secrets ready."
              until kubectl get secret ghcr-cred -n {{ $ns }} >/dev/null 2>&1; do
                echo "  ghcr-cred not ready yet, waiting 5s..."
                sleep 5
              done
              echo "  ghcr-cred ready."
              echo "Both secrets synced — proceeding with install."
{{- end }}
