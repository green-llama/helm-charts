# Default values for k8-glerp-ai-intake
# Override per environment with -f values-prod.yaml or --set

image:
  repository: ghcr.io/green-llama/k8-glerp-ai-intake
  tag: "0.3.10"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-cred

# -- Number of API gateway replicas
apiReplicas: 1
# -- Number of async worker replicas
workerReplicas: 2
# -- ReplicaSet history retained for rollback (Rancher GUI: Additional Values → revisionHistoryLimit)
revisionHistoryLimit: 3

# -- Non-secret configuration (mirrors 00-configmap.yaml)
config:
  APP_ENV: "development"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "gemini"
  # 2026-11-03: gemini-2.5-flash deprecated (Google, EOL 2026-12-01) -- moved to its
  # replacement, with thinking_level=high. Must match app/config.py's own defaults.
  GEMINI_MODEL: "gemini-3.5-flash-lite"
  GEMINI_THINKING_LEVEL: "high"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  OPENAI_MODEL: "gpt-4o"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  VLLM_BASE_URL: "http://vllm-service.glerp-ai-intake.svc.cluster.local/v1"
  VLLM_MODEL: "deepseek-ai/DeepSeek-V3"
  REDIS_URL: ""  # auto-computed from .Release.Namespace; override explicitly if needed
  OCR_URL: ""    # auto-computed from .Release.Namespace; override explicitly if needed
  OCR_CONFIDENCE_THRESHOLD: "0.95"
  TEMP_STORAGE_PATH: "/tmp/intake-docs"
  CONTEXT_PROVIDER_AP: "gemini"
  CONTEXT_PROVIDER_LEGAL: "anthropic"
  CONTEXT_PROVIDER_LEAD: "gemini"
  CONTEXT_PROVIDER_EXPENSE: "gemini"
  CONTEXT_PROVIDER_SHIPPING: "gemini"
  CONTEXT_PROVIDER_CUSTOMER_PO: "gemini"
  CONTEXT_PROVIDER_SUPPLIER_QUOTE: "gemini"
  CONTEXT_PROVIDER_RECRUITMENT: "gemini"
  CONTEXT_PROVIDER_BANK_STATEMENT: "gemini"
  CONTEXT_PROVIDER_ISSUE: "gemini"

# -- Secret name that holds JWT_SECRET_KEY
# With eso.enabled=true (default) this secret is created automatically via ExternalSecret from Vault.
# With eso.enabled=false create manually: kubectl create secret generic intake-secrets -n <namespace> --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)"
existingSecret: intake-secrets

# -- External Secrets Operator + Vault integration
# Set eso.enabled=true to have the chart fully manage secrets via ESO (zero manual kubectl steps).
# Prerequisites: vault-backend and vault-pushwriter ClusterSecretStores must exist in the cluster.
eso:
  enabled: true
  vaultStore: vault-backend               # ClusterSecretStore for reads (ExternalSecrets)
  vaultMountPath: secret                  # KV v2 mount name
  ghcrVaultKey: secret/data/github/ghcr-cred  # shared Vault path for GHCR creds (same as glerp chart)
  pushSecrets:
    enabled: true                         # auto-generate JWT key and push to Vault on first install
    store: vault-pushwriter               # ClusterSecretStore for writes (PushSecrets)

# -- Redis deployment (enabled = deploy in-cluster Redis)
redis:
  enabled: true
  image: redis:7-alpine
  storageSize: 1Gi

# -- OCR (PaddleOCR PP-StructureV3 + docTR) -- served by services/ocr-api (PyTorch +
# PaddlePaddle on CUDA), NOT run in-process in intake-api/intake-worker anymore. Same
# migration pattern as k8-glerp-ai-agent's rerank-api/embed-api split; see
# templates/ocr-gpu.yaml and app/pipelines/ocr_client.py.
ocr:
  enabled: true
  image: ghcr.io/green-llama/k8-glerp-ai-intake-ocr:0.3.10
  device: cuda                                         # "cpu" only as a local-dev fallback
  # No PVC -- weights are baked into the image (services/ocr-api/Dockerfile); a PVC mounted
  # at /data was tried and removed, confirmed live 2026-10-15: it shadows the image's own
  # baked-in /data/doctr, /data/paddleocr content with an empty volume, forcing a full
  # re-download at every pod start. See templates/ocr-gpu.yaml's comment.
  nodeSelector: { nvidia.com/gpu.present: "true" }     # GPU-only image; always target the GPU node
  resources:
    # Two models (PaddleOCR det+rec+cls, docTR det+reco) resident at once -- GPU memory,
    # not CPU/RAM, is the real constraint, requested via nvidia.com/gpu below. CPU here only
    # needs to feed image decode/preprocessing, not run inference.
    requests: { cpu: 500m, memory: 3Gi }
    limits:   { cpu: "2",  memory: 5Gi, nvidia.com/gpu: 1 }

# -- Ingress (Traefik IngressRoute)
ingress:
  enabled: true
  # Domain suffix — FQDN is computed as <namespace>.<domain>
  # dev cluster:  dev.greenllama.tech  → glerp-ai-intake-sandbox.dev.greenllama.tech
  # prod cluster: greenllama.tech      → glerp-ai-intake.greenllama.tech
  domain: ""
  # external-dns CNAME target (Cloudflare proxy record)
  externalDnsTarget: "pec.greenllama.tech"
  # Strip-prefix middleware name (auto-created if ingress.enabled)
  middlewareName: intake-strip-prefix

# -- Resource limits
resources:
  api:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  worker:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Ephemeral scratch volume for document processing
workerScratchSizeLimit: 500Mi
