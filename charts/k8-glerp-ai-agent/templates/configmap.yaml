apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
  {{- /* Auto-compute datastore URLs from the release namespace when left blank.
         POSTGRES_DSN is NOT set here — it is assembled with the password into the
         <fullname>-postgres Secret (ESO or the fallback secret template). */}}
  {{- range $key, $val := .Values.config }}
  {{- if eq $key "POSTGRES_DSN" }}
  {{- if ne $val "" }}
  POSTGRES_DSN: {{ $val | quote }}
  {{- end }}
  {{- else if and (eq $key "REDIS_URL") (eq $val "") }}
  REDIS_URL: {{ printf "redis://%s:6379/0" (include "agent.redisHost" $) | quote }}
  {{- else if and (eq $key "QDRANT_URL") (eq $val "") }}
  QDRANT_URL: {{ printf "http://%s:6333" (include "agent.qdrantHost" $) | quote }}
  {{- else if and (eq $key "EMBED_URL") (eq $val "") }}
  EMBED_URL: {{ printf "http://%s:80" (include "agent.embedHost" $) | quote }}
  {{- else if and (eq $key "RERANK_URL") (eq $val "") }}
  RERANK_URL: {{ printf "http://%s:80" (include "agent.rerankHost" $) | quote }}
  {{- else if and (eq $key "HOSTED_VLLM_BASE_URL") (eq $val "") }}
  HOSTED_VLLM_BASE_URL: {{ printf "http://%s:80/v1" (include "agent.vllmLightHost" $) | quote }}
  {{- else }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  # The version the services report (/healthz and the GLerp connection check): the
  # deployed image tag. All GLerp AI components share one MAJOR version (2.x).
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  # FRAPPE_BASE_URL kept rendered unchanged -- BACKEND_BASE_URL added alongside it with
  # the identical value (2026-10-23, engine/GLerp boundary audit item #4:
  # docs/INTEGRATION_BOUNDARY.md). This is a plain ConfigMap value, not Vault/ESO-backed,
  # so adding it here carries none of the ExternalSecret risk the API-key/secret rename
  # would (see this chart's externalsecrets.yaml, deliberately left untouched for those
  # two -- the Vault property names stay frappe-api-key/frappe-api-secret for now).
  FRAPPE_BASE_URL: {{ .Values.frappe.baseUrl | default "" | quote }}
  BACKEND_BASE_URL: {{ .Values.frappe.baseUrl | default "" | quote }}
