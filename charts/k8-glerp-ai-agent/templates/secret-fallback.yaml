{{- /*
  Fallback secrets for eso.enabled=false (dev / CI / air-gapped without Vault).
  Values persist across upgrades via the "lookup" trick so a re-render doesn't rotate them.
  For any real deployment use eso.enabled=true instead.
*/}}
{{- if not .Values.eso.enabled }}
{{- $fullname := include "agent.fullname" . -}}
{{- $ns := .Release.Namespace -}}

{{- $existingJwt := (lookup "v1" "Secret" $ns .Values.existingSecret) -}}
{{- $jwt := "" -}}
{{- if and $existingJwt $existingJwt.data (index $existingJwt.data "JWT_HS256_SECRET") -}}
{{-   $jwt = index $existingJwt.data "JWT_HS256_SECRET" | b64dec -}}
{{- else -}}
{{-   $jwt = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_HS256_SECRET: {{ $jwt | quote }}
  {{- if .Values.frappe.baseUrl }}
  FRAPPE_API_KEY: {{ .Values.frappeApiKey | default "" | quote }}
  FRAPPE_API_SECRET: {{ .Values.frappeApiSecret | default "" | quote }}
  {{- end }}
{{- if .Values.postgres.enabled }}
---
{{- $pgName := printf "%s-postgres" $fullname -}}
{{- $existingPg := (lookup "v1" "Secret" $ns $pgName) -}}
{{- $pw := "" -}}
{{- if and $existingPg $existingPg.data (index $existingPg.data "POSTGRES_PASSWORD") -}}
{{-   $pw = index $existingPg.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{-   $pw = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  POSTGRES_DSN: {{ printf "postgresql://%s:%s@%s-postgres.%s.svc.cluster.local:5432/%s" .Values.postgres.user $pw $fullname $ns .Values.postgres.database | quote }}
{{- end }}
{{- end }}
