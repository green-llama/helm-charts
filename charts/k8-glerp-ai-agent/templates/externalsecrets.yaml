{{- if .Values.eso.enabled }}
{{- $ns := .Release.Namespace -}}
{{- $mount := .Values.eso.vaultMountPath -}}
{{- $fullname := include "agent.fullname" . -}}
# ── agent-secrets : JWT signing key(s) ───────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-agent-secrets-es
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        JWT_HS256_SECRET: "{{ printf `{{ .jwt_hs256_secret }}` }}"
        {{- if .Values.frappe.baseUrl }}
        FRAPPE_API_KEY: "{{ printf `{{ .frappe_api_key }}` }}"
        FRAPPE_API_SECRET: "{{ printf `{{ .frappe_api_secret }}` }}"
        {{- end }}
        {{- if .Values.orchestrator.enabled }}
        ORCH_ENGINE_KEY: "{{ printf `{{ .orchestrator_key }}` }}"
        {{- end }}
  data:
    - secretKey: jwt_hs256_secret
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/agent-secrets
        property: jwt-hs256-secret
    {{- if .Values.frappe.baseUrl }}
    - secretKey: frappe_api_key
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/agent-secrets
        property: frappe-api-key
    - secretKey: frappe_api_secret
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/agent-secrets
        property: frappe-api-secret
    {{- end }}
    {{- if .Values.orchestrator.enabled }}
    # glerp-ai-orchestrator docs/ROUTE_CONTRACT.md (migration step 2) -- the SAME Vault
    # property, mounted into BOTH this service (as ORCH_ENGINE_KEY) and the orchestrator
    # (as its own ORCH_ENGINE_KEY), so a single Vault write keeps both sides in sync. Per
    # the ESO lesson (feedback_eso_pushsecret_paths), this property must already exist at
    # this Vault path BEFORE `orchestrator.enabled` is turned on here -- an ExternalSecret
    # `data[]` entry referencing a not-yet-existing property fails the WHOLE object's
    # sync, including JWT_HS256_SECRET above, not just this one field.
    - secretKey: orchestrator_key
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/agent-secrets
        property: orchestrator-key
    {{- end }}
---
{{- if .Values.postgres.enabled }}
# ── <fullname>-postgres : DB password + assembled DSN ────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-postgres-es
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: {{ $fullname }}-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ printf `{{ .pw }}` }}"
        POSTGRES_DSN: {{ printf "\"postgresql://%s:{{ .pw }}@%s-postgres.%s.svc.cluster.local:5432/%s\"" .Values.postgres.user $fullname $ns .Values.postgres.database }}
  data:
    - secretKey: pw
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/agent-postgres
        property: password
{{- end }}
---
{{- if .Values.orchestrator.enabled }}
# ── orchestrator-postgres : training-loop DB password + assembled DSN ────────
# Separate database+role from the engine's own "agent" database, per
# docs/TRAINING_LOOP_DESIGN.md -- same bundled Postgres instance, own role, so it can be
# split onto its own instance later without migrating across an ownership boundary. The
# role/database are created once via psql (not by this chart); this just gets the
# generated password (vault-seed.yaml) back into a Secret as a ready-to-use DSN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-orchestrator-postgres-es
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: orchestrator-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ORCH_DATABASE_URL: {{ printf "\"postgresql+asyncpg://orchestrator:{{ .pw }}@%s-postgres.%s.svc.cluster.local:5432/orchestrator\"" $fullname $ns }}
  data:
    - secretKey: pw
      remoteRef:
        key: {{ $mount }}/data/{{ $ns }}/orchestrator-postgres
        property: password
{{- end }}
---
# ── ghcr-cred : GHCR image pull (shared Vault path, standard name) ───────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-cred
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: ghcr-cred
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ printf `{{ .config }}` }}"
  data:
    - secretKey: config
      remoteRef:
        key: {{ .Values.eso.ghcrVaultKey }}
        property: config
{{- if .Values.gdrive.enabled }}
---
# ── gdrive-sa : Google service-account key for the Shared Drive connector ────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gdrive.secretName }}-es
  namespace: {{ $ns }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.eso.vaultStore }}
  target:
    name: {{ .Values.gdrive.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key.json: "{{ printf `{{ .key }}` }}"
  data:
    - secretKey: key
      remoteRef:
        key: {{ .Values.eso.gdriveVaultKey }}
        property: key.json
{{- end }}
{{- end }}
