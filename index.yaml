  glerp-monitoring:
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: "Trivy scan-job throughput: scanJobTTL 1h -> 90s and scanJobsConcurrentLimit 1 -> 10. Completed scan Jobs count against the concurrency limit; at 1h TTL they occupied every slot and starved new scans, so on a full-cluster scan most workloads never got a report and deleting a report didn't regenerate it (looked like the operator was wedged). Root-caused via debug logs; verified the queue now drains and all app workloads scan"
        - kind: changed
          description: "Upgrade trivy-operator subchart 0.32.1 -> 0.35.0 (app 0.30.1 -> 0.33.0)"
        - kind: fixed
          description: "Bound Trivy vulnerability scan severity so VulnerabilityReport CRDs stay under the Kubernetes 3 MiB object limit — large glerp-image reports at all-5 severities exceeded it, so the CRD was never written (Request entity too large) and the workload silently got no metric and no dashboard data. Severity is configurable; widening past the safe scope risks re-hitting the limit on the heaviest images"
        - kind: removed
          description: "Dead scanJobAdditionalEnvVars/DOCKER_CONFIG scan-job config (invalid subchart key, never rendered) and the unused ghcr-docker-config scan-job volume — Trivy authenticates private scans natively via the workload imagePullSecrets (ghcr-cred)"
    apiVersion: v2
    appVersion: 2.2.1
    created: "2026-08-11T13:47:05.901912694Z"
    dependencies:
    - alias: blackbox-exporter
      condition: blackbox-exporter.enabled
      name: prometheus-blackbox-exporter
      repository: https://prometheus-community.github.io/helm-charts
      version: 9.4.0
    - condition: trivy-operator.enabled
      name: trivy-operator
      repository: https://aquasecurity.github.io/helm-charts/
      version: 0.35.0
    - condition: prometheus-pushgateway.enabled
      name: prometheus-pushgateway
      repository: https://prometheus-community.github.io/helm-charts
      version: 2.14.0
    description: 'Unified observability for GLerp RKE2 clusters. Covers uptime/SLA
      probing (Blackbox Exporter), storage utilization (Longhorn, MinIO, DirectPV,
      node filesystems), and security compliance (Trivy CVE scanning, kube-bench CIS,
      OWASP ZAP). Includes shared VictoriaMetrics (90-day retention), unified AlertManager
      routing, and nine Grafana dashboards. New sites auto-discovered by labeling
      their Kubernetes Service. '
    digest: a69c9375572dff029075fd1ccd06eae03297da3fe770b349edc9f61bd9902c58
    home: https://github.com/green-llama/k8-glerp-monitoring
    icon: https://raw.githubusercontent.com/green-llama/helm-charts/main/icons/glerp-monitoring.svg
    keywords:
    - monitoring
    - uptime
    - sla
    - storage
    - longhorn
    - minio
    - directpv
    - security
    - trivy
    - kube-bench
    - owasp-zap
    - glerp
    - erpnext
    maintainers:
    - email: ops@greenllama.tech
      name: Green Llama Technologies
    name: glerp-monitoring
    sources:
    - https://github.com/green-llama/k8-glerp-monitoring
    type: application
    urls:
    - https://github.com/green-llama/helm-charts/releases/download/glerp-monitoring-2.2.1/glerp-monitoring-2.2.1.tgz
    version: 2.2.1
  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: "Upgrade trivy-operator subchart 0.32.1 -> 0.35.0 (app 0.30.1 -> 0.33.0) for a more robust vuln-scan reconciler"
        - kind: fixed
          description: "Bound Trivy vulnerability scan severity so VulnerabilityReport CRDs stay under the Kubernetes 3 MiB object limit — large glerp-image reports at all-5 severities exceeded it, so the CRD was never written (Request entity too large) and the workload silently got no metric and no dashboard data. Severity is configurable; widening past the safe scope risks re-hitting the limit on the heaviest images"
        - kind: removed
          description: "Dead scanJobAdditionalEnvVars/DOCKER_CONFIG scan-job config (invalid subchart key, never rendered) and the unused ghcr-docker-config scan-job volume — Trivy authenticates private scans natively via the workload imagePullSecrets (ghcr-cred)"
    apiVersion: v2
