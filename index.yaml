  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: "GHCR pull secret conforms to the shared ESO+Vault standard: reads secret/data/github/ghcr-cred via the vault-backend ClusterSecretStore and creates a secret named ghcr-cred (was ghcr-pull-secret from a self-created k8s-to-k8s store). Cross-namespace ClusterExternalSecret fan-out retained so Trivy can scan private images in labeled namespaces"
        - kind: removed
          description: "Self-created ghcr-cluster-secret-store.yaml (k8s-ghcr-source) — now uses the shared cluster-wide vault-backend ClusterSecretStore"
    apiVersion: v2
    appVersion: 2.1.20
